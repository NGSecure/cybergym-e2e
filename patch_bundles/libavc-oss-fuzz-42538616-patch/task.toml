version = "1.0"

[task]
name = "nwrc/cybergym-e2e-libavc-oss-fuzz-42538616-patch"
description = "CyberGym-E2E patch-only task (libavc, OSS-Fuzz): patch the vulnerability shown by a sanitizer crash log and its PoC without breaking the project's tests. Graded by the upstream validate.py stages in a separate judge container."
keywords = ["cybergym-e2e", "patch-only", "oss-fuzz", "libavc", "address", "vulnerability", "patch"]

[metadata]
benchmark = "cybergym-e2e"
mode = "patch-only"
upstream_task = "libavc/oss-fuzz_42538616"
upstream_task_id = "oss-fuzz:42538616"
source = "oss-fuzz"
project = "libavc"
language = "c++"
sanitizer = "address"
fuzz_target = "mvc_dec_fuzzer"
difficulty = "medium"
category = "security"
data_notes = ["judge-time network fetch (test.sh: download), upstream validates online"]
upstream_commit = "8365b29cc218d1613f06c277a26b082b6f2d02a8"
hf_revision = "e12e79d71ad9342287f20c0862affa8abfa7d14a"
version_tag = "v0.0.1"

[verifier]
# The judge recompiles the project for every stage it runs (e2e: up to four builds plus the
# project's test suite; patch-only: two builds plus the test suite). Calibrate from the pilots.
timeout_sec = 7200.0

[agent]
# Upstream default (scripts/run_agent.py DEFAULT_TIMEOUT = 5400).
timeout_sec = 5400.0

[environment]
# Two images: agent sandbox (main) and judge (task-server). Local tags for local runs;
# push.sh backfills the SWR addresses.
docker_image = "cge2e_51e0aa2cd6_main_patch:v0.0.1"
task_server_image = "cge2e_51e0aa2cd6_ts:v0.0.1"
build_timeout_sec = 7200.0
cpus = 4
memory_mb = 16384
