version = "1.0"

[task]
name = "nwrc/cybergym-e2e-dav1d-arvo-60432-patch"
description = "CyberGym-E2E patch-only task (dav1d, ARVO): patch the vulnerability shown by a sanitizer crash log and its PoC without breaking the project's tests. Graded by the upstream validate.py stages in a separate judge container."
keywords = ["cybergym-e2e", "patch-only", "arvo", "dav1d", "address", "vulnerability", "patch"]

[metadata]
benchmark = "cybergym-e2e"
mode = "patch-only"
upstream_task = "dav1d/arvo_60432"
upstream_task_id = "arvo:60432"
source = "arvo"
project = "dav1d"
language = "c++"
sanitizer = "address"
fuzz_target = "dav1d_fuzzer_mt"
difficulty = "medium"
category = "security"
data_notes = []
upstream_commit = "8365b29cc218d1613f06c277a26b082b6f2d02a8"
hf_revision = "e12e79d71ad9342287f20c0862affa8abfa7d14a"
version_tag = "v0.0.1"

[verifier]
# The judge recompiles the project for every stage it runs (e2e: up to four builds plus the
# project's test suite; patch-only: two builds plus the test suite). Calibrate from the pilots.
timeout_sec = 7200.0

[agent]
# Upstream default (scripts/run_agent.py DEFAULT_TIMEOUT = 5400).
timeout_sec = 5400.0

[environment]
# Two images: agent sandbox (main) and judge (task-server). Local tags for local runs;
# push.sh backfills the SWR addresses.
docker_image = "cge2e_ce8f228530_main_patch:v0.0.1"
task_server_image = "cge2e_ce8f228530_ts:v0.0.1"
build_timeout_sec = 7200.0
cpus = 4
memory_mb = 16384
