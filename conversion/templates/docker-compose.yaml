# CyberGym-E2E task-server sidecar (generated by conversion/convert.py).
# Merged on top of Harbor's base docker-compose config. The task-server holds the
# ground-truth PoC and the judge; the agent sandbox only reaches it over HTTP, and the
# verifier (tests/test.sh) sends it the agent's deliverables.
services:
  main:
    cap_add:
      - NET_ADMIN
    environment:
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - GOOGLE_BASE_URL=${GOOGLE_BASE_URL:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-}
      - AZURE_BASE_URL=${AZURE_BASE_URL:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - DOUBAO_BASE_URL=${DOUBAO_BASE_URL:-}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-}
      - DYNAMO_BASE_URL=${DYNAMO_BASE_URL:-}
      - HF_ENDPOINT_URL=${HF_ENDPOINT_URL:-}
    depends_on:
      task-server:
        condition: service_healthy

  task-server:
    image: @@TS_TAG@@
    build:
      context: ./task-server
      args:
        BASE_IMAGE: @@BASE_TAG@@
    platform: linux/amd64
    environment:
      - AUTH_TOKEN=@@AUTH_TOKEN@@
    expose:
      - "9111"
    deploy:
      resources:
        limits:
          cpus: "@@TS_CPUS@@"
          memory: @@TS_MEMORY_MB@@M
    healthcheck:
      test: ["CMD", "/scripts/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9111/health')"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
